[project]
name = "citis-ovpnp-gui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncssh>=2.18",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "keyring>=25",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]

[project.scripts]
citis-gui = "citis_gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/citis_gui"]